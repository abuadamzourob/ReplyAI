<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم ReplyAI | الرد التلقائي</title>

    <style>
        :root {
            --bg-dark: #0d0d0d;
            --card-bg: #1a1a1a;
            --gold: #d4af37;
            --gold-hover: #f3e5ab;
            --text-light: #ffffff;
            --text-muted: #a6a6a6;
            --border-gold: rgba(212, 175, 55, 0.3);
            --danger: #e74c3c;
            --danger-hover: #c0392b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0d0d0d 100%);
            color: var(--text-light);
            margin: 0;
            padding: 0;
        }

        header {
            border-bottom: 2px solid var(--gold);
            padding: 20px;
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--gold);
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .stat-card h3 {
            margin: 0 0 10px 0;
            color: var(--text-muted);
            font-size: 16px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: var(--gold);
        }

        .main-content {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 30px;
            overflow-x: auto;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .content-header h2 {
            margin: 0;
            color: var(--gold);
        }

        .add-btn {
            background: var(--gold);
            color: var(--bg-dark);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            min-width: 600px;
        }

        th, td {
            padding: 15px;
            text-align: right;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            background-color: rgba(212, 175, 55, 0.1);
            color: var(--gold);
        }

        .badge {
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .edit-btn {
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold);
            border: 1px solid var(--border-gold);
        }

        .delete-btn {
            background: rgba(231, 76, 60, 0.2);
            color: var(--danger);
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 2px solid var(--gold);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            padding: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            background: #0d0d0d;
            border: 1px solid var(--border-gold);
            border-radius: 6px;
            color: var(--text-light);
            box-sizing: border-box;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>ReplyAI | لوحة تحكم الرد التلقائي</h1>
    </header>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي قواعد الرد</h3>
                <div class="number" id="total-replies">0</div>
            </div>
            <div class="stat-card">
                <h3>حالة اتصال الداتابيز</h3>
                <div class="number" id="db-status" style="color: #e67e22; font-size: 16px; margin-top: 10px;">جاري الاتصال بقاعدة البيانات...</div>
            </div>
        </div>

        <div class="main-content">
            <div class="content-header">
                <h2>قواعد الرد الذكي الحالية</h2>
                <button class="add-btn" id="open-modal-btn">+ إضافة قاعدة رد جديدة</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>الكلمة المفتاحية</th>
                        <th>الرد التلقائي</th>
                        <th>الجدول المرتبط</th>
                        <th>الحالة</th>
                        <th style="text-align: center;">الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="data-table-body">
                    <tr>
                        <td colspan="5" style="text-align:center; color: var(--text-muted);">جاري تحميل البيانات الحقيقية...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-title">إضافة قاعدة رد تلقائي جديدة</h3>
            <form id="reply-form">
                <input type="hidden" id="edit-row-id" value="">
                <div class="form-group">
                    <label>الكلمة المفتاحية</label>
                    <input type="text" id="keyword-input" required>
                </div>
                <div class="form-group">
                    <label>نص الرد التلقائي</label>
                    <textarea id="reply-input" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>ربط بالجدول الداخلي</label>
                    <select id="table-select">
                        <option value="الجدول الأول">الجدول الأول</option>
                        <option value="الجدول الثاني">الجدول الثاني</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" id="close-modal-btn">إلغاء</button>
                    <button type="submit" class="add-btn" id="submit-modal-btn">حفظ القاعدة</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // البيانات الصحيحة والمربوطة بالكامل
        const SUPABASE_URL = "https://wnpvnmlubkqwkmwgmsch.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InducHZubWx1Ymtxd2ttd2dtc2NoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMTkwNDMsImV4cCI6MjEwMDc5NTA0M30.GS9f-1HZTGhm8YRLk2sOpz12mMduOkD8hLrwWANhOOA"; 

        const dbStatus = document.getElementById('db-status');
        const dataTableBody = document.getElementById('data-table-body');
        const totalRepliesElement = document.getElementById('total-replies');
        const openModalBtn = document.getElementById('open-modal-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const modalOverlay = document.getElementById('modal-overlay');
        const replyForm = document.getElementById('reply-form');
        const modalTitle = document.getElementById('modal-title');
        const submitModalBtn = document.getElementById('submit-modal-btn');
        const editRowId = document.getElementById('edit-row-id');

        let targetRowId = null;

        async function fetchReplies() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/conversations?select=*`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });

                if(!res.ok) throw new Error("استجابة السيرفر خاطئة");
                
                const data = await res.json();
                
                dbStatus.textContent = "متصل بنجاح 🚀";
                dbStatus.style.color = "#2ecc71";
                dbStatus.style.fontSize = "24px";
                
                renderTable(data);
            } catch (err) {
                dbStatus.textContent = "❌ فشل الاتصال: تأكد من إعدادات جدول (conversations) وتفعيل الـ RLS.";
                dbStatus.style.color = "#e74c3c";
            }
        }

        function renderTable(data) {
            dataTableBody.innerHTML = "";
            totalRepliesElement.textContent = data ? data.length : 0;

            if(data && data.length > 0) {
                data.forEach(item => {
                    const newRow = document.createElement('tr');
                    newRow.innerHTML = `
                        <td><span class="badge">${item.keyword}</span></td>
                        <td class="reply-text">${item.reply_text}</td>
                        <td class="associated-table">${item.associated_table || 'الجدول الأول'}</td>
                        <td style="color: #2ecc71;">نشط</td>
                        <td style="text-align: center;">
                            <button class="action-btn edit-btn" onclick="openEditModal(${item.id}, this)">تعديل</button>
                            <button class="action-btn delete-btn" onclick="deleteReply(${item.id}, this)">حذف</button>
                        </td>
                    `;
                    dataTableBody.appendChild(newRow);
                });
            } else {
                dataTableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-muted);">لا توجد قواعد رد مضافة حالياً.</td></tr>`;
            }
        }

        openModalBtn.addEventListener('click', () => {
            modalTitle.textContent = "إضافة قاعدة رد تلقائي جديدة";
            submitModalBtn.textContent = "حفظ القاعدة";
            editRowId.value = "";
            targetRowId = null;
            modalOverlay.classList.add('active');
        });

        closeModalBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
            replyForm.reset();
        });

        function openEditModal(id, button) {
            const row = button.closest('tr');
            targetRowId = id;
            document.getElementById('keyword-input').value = row.querySelector('.badge').textContent;
            document.getElementById('reply-input').value = row.querySelector('.reply-text').textContent;
            document.getElementById('table-select').value = row.querySelector('.associated-table').textContent;
            modalTitle.textContent = "تعديل قاعدة الرد";
            submitModalBtn.textContent = "تحديث البيانات";
            editRowId.value = "editing";
            modalOverlay.classList.add('active');
        }

        async function deleteReply(id, button) {
            if(confirm("هل أنت متأكد من الحذف؟")) {
                try {
                    await fetch(`${SUPABASE_URL}/rest/v1/conversations?id=eq.${id}`, {
                        method: 'DELETE',
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization": `Bearer ${SUPABASE_KEY}`
                        }
                    });
                    fetchReplies();
                } catch(e) { alert("فشل الحذف"); }
            }
        }

        replyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const keyword = document.getElementById('keyword-input').value;
            const replyText = document.getElementById('reply-input').value;
            const selectedTable = document.getElementById('table-select').value;

            try {
                let url = `${SUPABASE_URL}/rest/v1/conversations`;
                let method = 'POST';
                let headers = {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Content-Type": "application/json",
                    "Prefer": "return=minimal"
                };
                let body = { keyword: keyword, reply_text: replyText, associated_table: selectedTable };

                if (editRowId.value === "editing" && targetRowId) {
                    url += `?id=eq.${targetRowId}`;
                    method = 'PATCH';
                }

                const res = await fetch(url, {
                    method: method,
                    headers: headers,
                    body: JSON.stringify(body)
                });

                if(!res.ok) throw new Error("فشل الحفظ");

                modalOverlay.classList.remove('active');
                replyForm.reset();
                fetchReplies();
            } catch(err) {
                alert("حدث خطأ أثناء الحفظ: " + err.message);
            }
        });

        window.onload = fetchReplies;
    </script>
</body>
</html>
