<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم ResponseAI | الرد التلقائي</title>
    <!-- استدعاء مكتبة Supabase الرسمية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0d0d0d;
            --card-bg: #1a1a1a;
            --gold: #d4af37;
            --gold-hover: #f3e5ab;
            --text-light: #ffffff;
            --text-muted: #a6a6a6;
            --border-gold: rgba(212, 175, 55, 0.3);
            --danger: #e74c3c;
            --danger-hover: #c0392b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0d0d0d 100%);
            color: var(--text-light);
            margin: 0;
            padding: 0;
        }

        header {
            border-bottom: 2px solid var(--gold);
            padding: 20px;
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: var(--gold);
            color: var(--bg-dark);
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .stat-card h3 {
            margin: 0 0 10px 0;
            color: var(--text-muted);
            font-size: 16px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: var(--gold);
        }

        .main-content {
            background: var(--card-bg);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            overflow-x: auto;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .content-header h2 {
            margin: 0;
            color: var(--gold);
        }

        .add-btn {
            background: var(--gold);
            color: var(--bg-dark);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-btn:hover {
            background: var(--gold-hover);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            min-width: 600px;
        }

        th, td {
            padding: 15px;
            text-align: right;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            background-color: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            font-weight: 600;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        td {
            color: var(--text-light);
        }

        .badge {
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid var(--border-gold);
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: 0.2s;
            margin-left: 5px;
        }

        .edit-btn {
            background: rgba(212, 175, 55, 0.2);
            color: var(--gold);
            border: 1px solid var(--border-gold);
        }

        .edit-btn:hover {
            background: var(--gold);
            color: var(--bg-dark);
        }

        .delete-btn {
            background: rgba(231, 76, 60, 0.2);
            color: var(--danger);
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .delete-btn:hover {
            background: var(--danger);
            color: var(--text-light);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--card-bg);
            border: 2px solid var(--gold);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
            transform: scale(0.8);
            transition: 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h3 {
            margin: 0 0 20px 0;
            color: var(--gold);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            background: #0d0d0d;
            border: 1px solid var(--border-gold);
            border-radius: 6px;
            color: var(--text-light);
            box-sizing: border-box;
            font-family: inherit;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--gold);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .cancel-btn:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <header>
        <h1>ResponseAI | لوحة تحكم الرد التلقائي</h1>
        <a href="/index.html" class="back-btn">الرجوع للرئيسية</a>
    </header>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي الردود المؤتمتة</h3>
                <div class="number" id="total-replies">0</div>
            </div>
            <div class="stat-card">
                <h3>الرسائل المستلمة اليوم</h3>
                <div class="number">0</div>
            </div>
            <div class="stat-card">
                <h3>حالة الاتصال بـ Supabase</h3>
                <div class="number" id="db-status" style="color: #e74c3c; font-size: 20px; margin-top: 10px;">جاري الاتصال...</div>
            </div>
        </div>

        <div class="main-content">
            <div class="content-header">
                <h2>قواعد الرد الذكي المجدولة</h2>
                <button class="add-btn" id="open-modal-btn">+ إضافة قاعدة رد جديدة</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>الكلمة المفتاحية (الزناد)</th>
                        <th>الرد التلقائي الذكي</th>
                        <th>الجدول المرتبط</th>
                        <th>الحالة</th>
                        <th style="text-align: center;">الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="data-table-body">
                    <!-- سيمتلئ الجدول تلقائياً من Supabase -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- نافذة الإدخال والتعديل -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-title">إضافة قاعدة رد تلقائي جديدة</h3>
            <form id="reply-form">
                <input type="hidden" id="edit-row-id" value="">
                <div class="form-group">
                    <label>الكلمة المفتاحية (الكلمة المسببة للرد)</label>
                    <input type="text" id="keyword-input" placeholder="مثال: السلام عليكم، تفاصيل" required>
                </div>
                <div class="form-group">
                    <label>نص الرد التلقائي الذكي</label>
                    <textarea id="reply-input" rows="4" placeholder="اكتب الرد الذي سيصل للعميل تلقائياً..." required></textarea>
                </div>
                <div class="form-group">
                    <label>ربط بالجدول الداخلي</label>
                    <select id="table-select">
                        <option value="الجدول الأول">الجدول الأول</option>
                        <option value="الجدول الثاني">الجدول الثاني</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" id="close-modal-btn">إلغاء</button>
                    <button type="submit" class="add-btn" id="submit-modal-btn">حفظ القاعدة</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // إعدادات مشروع ReplyAI المحدثة بالكامل لجدول conversations
        const SUPABASE_URL = "https://wnpvnmlubkqwkmwgmsch.supabase.co";
        const SUPABASE_KEY = "Sb_publishable_cyyJR0wFM1YNgbgxYLUUxg_w1suy-11";
        
        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const openModalBtn = document.getElementById('open-modal-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const modalOverlay = document.getElementById('modal-overlay');
        const replyForm = document.getElementById('reply-form');
        const dataTableBody = document.getElementById('data-table-body');
        const totalRepliesElement = document.getElementById('total-replies');
        const modalTitle = document.getElementById('modal-title');
        const submitModalBtn = document.getElementById('submit-modal-btn');
        const editRowId = document.getElementById('edit-row-id');
        const dbStatus = document.getElementById('db-status');

        let targetRowId = null;

        // جلب البيانات فور تحميل الصفحة من جدول conversations
        async function fetchReplies() {
            try {
                const { data, error } = await supabase.from('conversations').select('*');
                
                if (error) throw error;

                dbStatus.textContent = "متصل بنجاح";
                dbStatus.style.color = "#2ecc71";
                
                dataTableBody.innerHTML = "";
                totalRepliesElement.textContent = data.length;

                data.forEach(item => {
                    const newRow = document.createElement('tr');
                    newRow.setAttribute('data-db-id', item.id);
                    newRow.innerHTML = `
                        <td><span class="badge">${item.keyword}</span></td>
                        <td class="reply-text">${item.reply_text}</td>
                        <td class="associated-table">${item.associated_table || 'الجدول الأول'}</td>
                        <td style="color: #2ecc71;">نشط</td>
                        <td style="text-align: center;">
                            <button class="action-btn edit-btn" onclick="openEditModal(${item.id}, this)">تعديل</button>
                            <button class="action-btn delete-btn" onclick="deleteReply(${item.id}, this)">حذف</button>
                        </td>
                    `;
                    dataTableBody.appendChild(newRow);
                });
            } catch (err) {
                console.error(err);
                dbStatus.textContent = "خطأ في الاتصال";
                dbStatus.style.color = "#e74c3c";
            }
        }

        // فتح للإضافة
        openModalBtn.addEventListener('click', () => {
            modalTitle.textContent = "إضافة قاعدة رد تلقائي جديدة";
            submitModalBtn.textContent = "حفظ القاعدة";
            editRowId.value = "";
            targetRowId = null;
            modalOverlay.classList.add('active');
        });

        // إغلاق النافذة
        closeModalBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
            replyForm.reset();
        });

        // حذف سطر حقيقي من جدول conversations
        async function deleteReply(id, button) {
            if(confirm("هل أنت متأكد من حذف هذه القاعدة نهائياً من قاعدة البيانات؟")) {
                const { error } = await supabase.from('conversations').delete().eq('id', id);
                if (!error) {
                    button.closest('tr').remove();
                    fetchReplies();
                } else {
                    alert("فشل الحذف، تأكد من إعدادات قاعدة البيانات");
                }
            }
        }

        // فتح نافذة التعديل ببيانات السطر المختار
        function openEditModal(id, button) {
            const row = button.closest('tr');
            targetRowId = id;

            document.getElementById('keyword-input').value = row.querySelector('.badge').textContent;
            document.getElementById('reply-input').value = row.querySelector('.reply-text').textContent;
            document.getElementById('table-select').value = row.querySelector('.associated-table').textContent;

            modalTitle.textContent = "تعديل قاعدة الرد";
            submitModalBtn.textContent = "تحديث البيانات";
            editRowId.value = "editing";
            
            modalOverlay.classList.add('active');
        }

        // إرسال البيانات (إضافة جديدة أو تحديث في جدول conversations)
        replyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const keyword = document.getElementById('keyword-input').value;
            const replyText = document.getElementById('reply-input').value;
            const selectedTable = document.getElementById('table-select').value;

            if (editRowId.value === "editing" && targetRowId) {
                // تحديث في Supabase
                const { error } = await supabase.from('conversations').update({
                    keyword: keyword,
                    reply_text: replyText,
                    associated_table: selectedTable
                }).eq('id', targetRowId);

                if (error) alert("فشل تحديث البيانات");
            } else {
                // إضافة جديدة في Supabase
                const { error } = await supabase.from('conversations').insert([{
                    keyword: keyword,
                    reply_text: replyText,
                    associated_table: selectedTable
                }]);

                if (error) alert("فشل إضافة القاعدة الجديدة. تأكد من إضافة الأعمدة بالداتابيز أولاً");
            }

            modalOverlay.classList.remove('active');
            replyForm.reset();
            fetchReplies();
        });

        // بدء تشغيل الجلب التلقائي عند فتح الصفحة
        window.onload = fetchReplies;
    </script>
</body>
</html>
