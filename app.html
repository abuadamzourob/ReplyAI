<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم ResponseAI</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #0d0d0d; color: #fff; padding: 20px; text-align: center; dir: rtl; }
        .card { background: #1a1a1a; border: 1px solid #d4af37; padding: 20px; border-radius: 10px; max-width: 500px; margin: 20px auto; }
        input, textarea { width: 90%; padding: 10px; margin: 10px 0; background: #000; color: #fff; border: 1px solid #d4af37; border-radius: 5px; }
        button { background: #d4af37; color: #000; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        table { width: 100%; max-width: 600px; margin: 20px auto; border-collapse: collapse; }
        th, td { border: 1px solid #d4af37; padding: 10px; text-align: center; }
        th { background: #d4af37; color: #000; }
    </style>
</head>
<body>

    <h1>لوحة تحكم الرد التلقائي (ReplyAI)</h1>
    
    <div class="card">
        <h3>حالة الاتصال: <span id="status" style="color: red;">جاري الفحص...</span></h3>
    </div>

    <div class="card">
        <h3>إضافة قاعدة جديدة</h3>
        <input type="text" id="keyword" placeholder="الكلمة المفتاحية (مثال: السعر)">
        <textarea id="reply" placeholder="نص الرد التلقائي"></textarea>
        <button onclick="addRule()">حفظ القاعدة</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>الكلمة المفتاحية</th>
                <th>الرد</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <script>
        const SUPABASE_URL = "https://wnpvnmlubkqwkmwgmsch.supabase.co";
        const SUPABASE_KEY = "Sb_publishable_cyyJR0wFM1YNgbgxYLUUxg_w1suy-11";
        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadData() {
            try {
                const { data, error } = await supabase.from('conversations').select('*');
                if (error) throw error;
                
                document.getElementById('status').textContent = "متصل بنجاح 🚀";
                document.getElementById('status').style.color = "green";
                
                const body = document.getElementById('table-body');
                body.innerHTML = "";
                data.forEach(item => {
                    body.innerHTML += `<tr><td>${item.keyword}</td><td>${item.reply_text}</td></tr>`;
                });
            } catch (err) {
                document.getElementById('status').textContent = "خطأ في الاتصال ❌";
                console.error(err);
            }
        }

        async function addRule() {
            const keyword = document.getElementById('keyword').value;
            const replyText = document.getElementById('reply').value;

            if(!keyword || !replyText) {
                alert("الرجاء تعبئة الحقول أولاً");
                return;
            }

            try {
                const { error } = await supabase.from('conversations').insert([{ 
                    keyword: keyword, 
                    reply_text: replyText,
                    associated_table: "الجدول الأول"
                }]);
                
                if (error) throw error;
                
                alert("تم الحفظ بنجاح في Supabase!");
                document.getElementById('keyword').value = "";
                document.getElementById('reply').value = "";
                loadData();
            } catch (err) {
                alert("فشل الحفظ: " + err.message);
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
